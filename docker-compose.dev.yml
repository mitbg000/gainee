# Local MySQL for development and for trying migrations before a deploy (offline).
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=mysql://root:devroot@127.0.0.1:3307/gainee
services:
  mysql:
    image: mysql:8.0
    container_name: gainee-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: devroot # local only
      MYSQL_DATABASE: gainee
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - gainee-mysql:/var/lib/mysql
volumes:
  gainee-mysql:
