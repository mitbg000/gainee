# Gainee – Nginx reverse proxy for aaPanel
#
# aaPanel → Website → (your site) → Config: paste this block INSIDE the `server { … }`
# that aaPanel generated, replacing any existing `location /` block.
# Keep aaPanel's own SSL lines (enable SSL in the site's "SSL" tab first).
# proxy_pass uses port 3100 (PORT in .env). If you change PORT, change it in EVERY proxy_pass line.
# aaPanel adds `location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$` and `location ~ .*\.(js|css)?$` blocks that
# serve those files from the empty site folder (→ 404: no favicon, no app icons, no service worker,
# so the app cannot be installed). Best: delete those two blocks. The `^~` / `=` locations below
# also win over them, so the app keeps working even if they stay.
# With Cloudflare in front: after changing this, purge the cache (Caching → Purge Everything),
# because Cloudflare keeps the old 404 answers for a few hours.

    # If the site config already has a client_max_body_size line, set that one to 30m and leave this one out
    # (nginx refuses the same directive twice: "client_max_body_size" directive is duplicate).
    client_max_body_size 30m;   # uploads: PDF, DOCX, images, audio

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;   # long AI requests
        proxy_send_timeout 300s;
        proxy_buffering off;       # streaming AI answers
    }

    # Next.js static assets are immutable – let browsers cache them.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Files the app itself serves (icons, favicon, service worker, uploaded images).
    # `^~` and `=` take priority over aaPanel's regex blocks for .png/.js.
    location ^~ /icons/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
    location = /sw.js {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";   # updates of the service worker must reach the browser
    }
    location = /favicon.ico   { proxy_pass http://127.0.0.1:3100; proxy_set_header Host $host; }
    location = /icon.png      { proxy_pass http://127.0.0.1:3100; proxy_set_header Host $host; }
    location = /apple-icon.png { proxy_pass http://127.0.0.1:3100; proxy_set_header Host $host; }

