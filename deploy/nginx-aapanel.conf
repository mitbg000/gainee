# Gainee – Nginx reverse proxy for aaPanel
#
# aaPanel → Website → (your site) → Config: paste this block INSIDE the `server { … }`
# that aaPanel generated, replacing any existing `location /` block.
# Keep aaPanel's own SSL lines (enable SSL in the site's "SSL" tab first).
# Change 3000 if you set a different PORT in .env.

    client_max_body_size 30m;   # uploads: PDF, DOCX, images, audio

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;   # long AI requests
        proxy_send_timeout 300s;
        proxy_buffering off;       # streaming AI answers
    }

    # Next.js static assets are immutable – let browsers cache them.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
