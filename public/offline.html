<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReadLearn – offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
         background: #faf7f1; color: #1d2433; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #13161c; color: #e6e8ec; } }
  img { width: 72px; height: 72px; border-radius: 16px; }
  button { margin-top: 16px; padding: 10px 18px; border-radius: 10px; border: 0; background: #1f4e79; color: #fff; font-size: 16px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You are offline · Bạn đang ngoại tuyến</h1>
    <p>Check your connection and try again.<br>Hãy kiểm tra kết nối mạng rồi thử lại.</p>
    <button onclick="location.reload()">Retry · Thử lại</button>
  </main>
</body>
</html>
